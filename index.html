<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EC Social Renderer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=0.2.1">
</head>
<body>
<header>
  <img src="assets/logo-ec-yellow.png" alt="El Comercio">
  <div><h1>EC Social Renderer</h1><small>v0.2.1 · Fotogalerías de Instagram</small></div>
</header>
<main>
  <section class="panel">
    <div class="job-row">
      <div>
        <label for="jobInput">1. Cargar job.json</label>
        <input id="jobInput" type="file" accept=".json,application/json">
      </div>
      <button id="loadExample" class="secondary">Cargar ejemplo</button>
    </div>
    <p class="note">Después de cargar el JSON, la galería se construye inmediatamente. La fotografía se elige dentro de cada slide y se procesa solo en tu navegador.</p>
    <div id="summary" class="summary"></div>
  </section>

  <section id="slidesSection" class="slides"></section>

  <section class="panel">
    <div class="toolbar">
      <button id="downloadZip" disabled>Descargar galería</button>
      <button id="downloadProject" class="secondary" disabled>Guardar project.json</button>
    </div>
    <p id="globalStatus" class="status"></p>
  </section>

  <section class="panel"><label>Caption</label><div id="caption" class="caption">—</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="template-ec-ig-galeria-01.js?v=0.2.1"></script>
<script src="app.js?v=0.2.1"></script>
</body>
</html>
